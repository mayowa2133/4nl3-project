version: 2
title: Turn-Level User Intent Classification 
description: Classify the primary communicative intent of a user turn in a task-oriented dialogue given the utterance and one turn of system context. Five-way classification over MultiWOZ 2.2 turns, manually adjudicated gold labels.
image: logo.jpg
registration_auto_approve: True  # do not require approval from admin to join the comp

terms: pages/terms.md
pages:
  - title: Overview
    file: pages/overview.md
  - title: Data
    file: pages/data.md
  - title: Evaluation
    file: pages/evaluation.md
  - title: Terms
    file: pages/terms.md

tasks:
  - index: 0
    name: Turn-Level User Intent Classification Task
    description: 'Evaluate new models and calculate their Macro F1 and Accuracy.'
    reference_data: reference_data/
    scoring_program: scoring_program/
    starting_kit: starting_kit/

phases:
  - name: Development
    description: 'Create models to predict the user intent label for each turn in the test set and submit the test results for evaluation.'
    start: 03-14-2026
    tasks:
      - 0

leaderboards:
  - title: Results
    key: main
    columns:
      - title: Macro F1
        key: f1_macro
        index: 0
        sorting: desc
      - title: Accuracy
        key: accuracy
        index: 1
        sorting: desc
